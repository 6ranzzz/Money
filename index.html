                                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"20px" }}>
                                    <h3 style={{ margin:0, fontSize:"18px" }}>New Savings Goal</h3>
                                    <button onClick={() => setGoalModal(null)} style={{ border:"none", background:"none", fontSize:"24px", color:"#ccc", cursor:"pointer" }}>✕</button>
                                </div>
                                <div style={{ display:"flex", gap:"6px", flexWrap:"wrap", marginBottom:"16px" }}>
                                    {GOAL_ICONS.map(ic => (
                                        <div key={ic} onClick={() => { setSelIcon(ic); setGoalForm({...goalForm, icon:ic}); }} className={`goal-icon-btn ${selIcon===ic?"active":""}`}>{ic}</div>
                                    ))}
                                </div>
                                <input placeholder="Goal name (e.g. Travel)" value={goalForm.name} onChange={e => setGoalForm({...goalForm, name:e.target.value})}
                                    style={{ width:"100%", padding:"14px", background:"#f8f8f8", border:"none", borderRadius:"14px", fontSize:"15px", outline:"none", marginBottom:"12px", boxSizing:"border-box" }} />
                                <div style={{ fontSize:"12px", color:"#999", marginBottom:"6px" }}>Target Amount</div>
                                <div style={{ textAlign:"center", marginBottom:"16px" }}>
                                    <div style={{ fontSize:"14px", color:"#bbb", height:"18px" }}>{calcExpr}</div>
                                    <div style={{ fontSize:"32px", fontWeight:"800", color:"#1a1a1a" }}>¥{goalForm.targetAmount}</div>
                                </div>
                                <div style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"16px" }}>
                                    <span style={{ fontSize:"13px", color:"#666" }}>Target Date:</span>
                                    <div onClick={() => setGoalModal("addDate")} style={{ background:"#f5f5f5", padding:"8px 12px", borderRadius:"10px", fontSize:"14px", fontWeight:"600", cursor:"pointer" }}>{goalForm.targetDate.replace(/-/g,"/")}</div>
                                </div>
                                <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:"6px", background:"#f2f2f2", padding:"10px", borderRadius:"16px" }}>
                                    {["1","2","3","AC","4","5","6","+","7","8","9","-",".","0","DEL","OK"].map(k => (
                                        <button key={k} onClick={() => onKeyboardInput(k, goalForm.targetAmount, (v)=>setGoalForm(p=>({...p,targetAmount:typeof v==='function'?v(p.targetAmount):v})), (final)=>{ setGoalForm(p=>({...p,targetAmount:String(final)})); })}
                                            className={`num-btn ${k==='OK'?'primary-btn':''}`}
                                            style={k==='=' ? {background:"#f0f0f0", fontWeight:"700"} : {}}>
                                            {k}
                                        </button>
                                    ))}
                                </div>
                                <button onClick={addGoal} style={{ width:"100%", marginTop:"16px", background:"#1a1a1a", color:"#fff", border:"none", padding:"14px", borderRadius:"14px", fontSize:"15px", fontWeight:"700", cursor:"pointer" }}>Create Goal</button>
                            </div>
                        </div>
                    )}
                    {goalModal === "addDate" && (
                        <DatePickerModal value={goalForm.targetDate} onConfirm={d => { setGoalForm(f=>({...f,targetDate:d})); setGoalModal("add"); }} onClose={() => setGoalModal("add")} />
                    )}
                    {goalModal === "edit" && (
                        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.6)", zIndex:160, display:"flex", flexDirection:"column-reverse" }}>
                            <div style={{ background:"#fff", borderRadius:"28px 28px 0 0", padding:"25px", animation:"slideUp 0.3s" }}>
                                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"20px" }}>
                                    <h3 style={{ margin:0, fontSize:"18px" }}>Edit Goal</h3>
                                    <button onClick={() => { setGoalModal(null); setEditingGoal(null); }} style={{ border:"none", background:"none", fontSize:"24px", color:"#ccc", cursor:"pointer" }}>✕</button>
                                </div>
                                <div style={{ display:"flex", gap:"6px", flexWrap:"wrap", marginBottom:"16px" }}>
                                    {GOAL_ICONS.map(ic => (
                                        <div key={ic} onClick={() => { setSelIcon(ic); setGoalForm({...goalForm, icon:ic}); }} className={`goal-icon-btn ${selIcon===ic?"active":""}`}>{ic}</div>
                                    ))}
                                </div>
                                <input placeholder="Goal name" value={goalForm.name} onChange={e => setGoalForm({...goalForm, name:e.target.value})}
                                    style={{ width:"100%", padding:"14px", background:"#f8f8f8", border:"none", borderRadius:"14px", fontSize:"15px", outline:"none", marginBottom:"12px", boxSizing:"border-box" }} />
                                <div style={{ fontSize:"12px", color:"#999", marginBottom:"6px" }}>Target Amount</div>
                                <div style={{ textAlign:"center", marginBottom:"16px" }}>
                                    <div style={{ fontSize:"14px", color:"#bbb", height:"18px" }}>{calcExpr}</div>
                                    <div style={{ fontSize:"32px", fontWeight:"800", color:"#1a1a1a" }}>¥{goalForm.targetAmount}</div>
                                </div>
                                <div style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"16px" }}>
                                    <span style={{ fontSize:"13px", color:"#666" }}>Target Date:</span>
                                    <div onClick={() => setGoalModal("editDate")} style={{ background:"#f5f5f5", padding:"8px 12px", borderRadius:"10px", fontSize:"14px", fontWeight:"600", cursor:"pointer" }}>{goalForm.targetDate.replace(/-/g,"/")}</div>
                                </div>
                                <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:"6px", background:"#f2f2f2", padding:"10px", borderRadius:"16px" }}>
                                    {["1","2","3","AC","4","5","6","+","7","8","9","-",".","0","DEL","OK"].map(k => (
                                        <button key={k} onClick={() => onKeyboardInput(k, goalForm.targetAmount, (v)=>setGoalForm(p=>({...p,targetAmount:typeof v==='function'?v(p.targetAmount):v})), (final)=>{ setGoalForm(p=>({...p,targetAmount:String(final)})); })}
                                            className={`num-btn ${k==='OK'?'primary-btn':''}`}
                                            style={k==='=' ? {background:"#f0f0f0", fontWeight:"700"} : {}}>
                                            {k}
                                        </button>
                                    ))}
                                </div>
                                <button onClick={updateGoal} style={{ width:"100%", marginTop:"16px", background:"#1a1a1a", color:"#fff", border:"none", padding:"14px", borderRadius:"14px", fontSize:"15px", fontWeight:"700", cursor:"pointer" }}>Save Changes</button>
                            </div>
                        </div>
                    )}
                    {goalModal === "editDate" && (
                        <DatePickerModal value={goalForm.targetDate} onConfirm={d => { setGoalForm(f=>({...f,targetDate:d})); setGoalModal("edit"); }} onClose={() => setGoalModal("edit")} />
                    )}
                    {goalModal === "deposit" && editingGoal && (
                        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.6)", zIndex:160, display:"flex", flexDirection:"column-reverse" }}>
                            <div style={{ background:"#fff", borderRadius:"28px 28px 0 0", padding:"25px", animation:"slideUp 0.3s" }}>
                                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"20px" }}>
                                    <h3 style={{ margin:0, fontSize:"18px" }}>Deposit to {editingGoal.icon} {editingGoal.name}</h3>
                                    <button onClick={() => setGoalModal(null)} style={{ border:"none", background:"none", fontSize:"24px", color:"#ccc", cursor:"pointer" }}>✕</button>
                                </div>
                                <div style={{ textAlign:"center", marginBottom:"24px" }}>
                                    <div style={{ fontSize:"14px", color:"#bbb", height:"18px" }}>{calcExpr}</div>
                                    <div style={{ fontSize:"36px", fontWeight:"800", color:"#27ae60" }}>¥{goalAmount}</div>
                                    <div style={{ fontSize:"12px", color:"#999", marginTop:"4px" }}>Current: ¥{editingGoal.currentAmount.toLocaleString()} / ¥{editingGoal.targetAmount.toLocaleString()}</div>
                                </div>
                                <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:"6px", background:"#f2f2f2", padding:"10px", borderRadius:"16px" }}>
                                    {["1","2","3","AC","4","5","6","+","7","8","9","-",".","0","DEL","OK"].map(k => (
                                        <button key={k} onClick={() => onKeyboardInput(k, goalAmount, setGoalAmount, (final)=>depositToGoal(editingGoal.id, final))}
                                            className={`num-btn ${k==='OK'?'primary-btn':''}`}
                                            style={k==='=' ? {background:"#f0f0f0", fontWeight:"700"} : {}}>
                                            {k}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                    {goalModal === "withdraw" && editingGoal && (
                        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.6)", zIndex:160, display:"flex", flexDirection:"column-reverse" }}>
                            <div style={{ background:"#fff", borderRadius:"28px 28px 0 0", padding:"25px", animation:"slideUp 0.3s" }}>
                                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"20px" }}>
                                    <h3 style={{ margin:0, fontSize:"18px" }}>Withdraw from {editingGoal.icon} {editingGoal.name}</h3>
                                    <button onClick={() => setGoalModal(null)} style={{ border:"none", background:"none", fontSize:"24px", color:"#ccc", cursor:"pointer" }}>✕</button>
                                </div>
                                <div style={{ textAlign:"center", marginBottom:"24px" }}>
                                    <div style={{ fontSize:"14px", color:"#bbb", height:"18px" }}>{calcExpr}</div>
                                    <div style={{ fontSize:"36px", fontWeight:"800", color:"#666" }}>¥{goalAmount}</div>
                                    <div style={{ fontSize:"12px", color:"#999", marginTop:"4px" }}>Available: ¥{editingGoal.currentAmount.toLocaleString()}</div>
                                </div>
                                <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:"6px", background:"#f2f2f2", padding:"10px", borderRadius:"16px" }}>
                                    {["1","2","3","AC","4","5","6","+","7","8","9","-",".","0","DEL","OK"].map(k => (
                                        <button key={k} onClick={() => onKeyboardInput(k, goalAmount, setGoalAmount, (final)=>withdrawFromGoal(editingGoal.id, final))}
                                            className={`num-btn ${k==='OK'?'primary-btn':''}`}
                                            style={k==='=' ? {background:"#f0f0f0", fontWeight:"700"} : {}}>
                                            {k}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        const fmt = (n) => "¥" + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2 });
        const getMonthKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
        const getDateKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
        function App() {
            const [records, setRecords] = useState(() => JSON.parse(localStorage.getItem('records')) || []);
            const [initialBalance, setInitialBalance] = useState(() => Number(localStorage.getItem('initBal')) || 0);
            const [customCats, setCustomCats] = useState(() => JSON.parse(localStorage.getItem('customCats')) || { income:[], expense:[] });
            const [modal, setModal] = useState(null);
            const [viewMonth, setViewMonth] = useState(getMonthKey(new Date()));
            const [calcExpr, setCalcExpr] = useState("");
            const [balanceHidden, setBalanceHidden] = useState(() => localStorage.getItem('balHidden') === 'true');
            const [showChart, setShowChart] = useState(false);
            const [form, setForm] = useState({ id:null, type:"expense", amount:"0", category:null, desc:"", date:getDateKey(new Date()), goalId:null, goalAmount:"0" });
            const [tempBal, setTempBal] = useState("0");
            const [budget, setBudget] = useState(() => Number(localStorage.getItem('budget')) || 0);
            const [tempBudget, setTempBudget] = useState("0");
            const [showBudgetSetting, setShowBudgetSetting] = useState(false);
            const [savingsGoals, setSavingsGoals] = useState(() => JSON.parse(localStorage.getItem('savingsGoals')) || []);
            const [showGoals, setShowGoals] = useState(false);
            const [goalModal, setGoalModal] = useState(null);
            const [editingGoal, setEditingGoal] = useState(null);
            const [goalForm, setGoalForm] = useState({ name:"", targetAmount:"0", targetDate:getDateKey(new Date()), icon:"🎯" });
            const [goalAmount, setGoalAmount] = useState("0");
            const allCats = useMemo(() => ({
                income: [...DEFAULT_CATEGORIES.income, ...customCats.income],
                expense: [...DEFAULT_CATEGORIES.expense, ...customCats.expense]
            }), [customCats]);
            useEffect(() => localStorage.setItem('records', JSON.stringify(records)), [records]);
            useEffect(() => localStorage.setItem('initBal', initialBalance), [initialBalance]);
            useEffect(() => localStorage.setItem('customCats', JSON.stringify(customCats)), [customCats]);
            useEffect(() => localStorage.setItem('balHidden', balanceHidden), [balanceHidden]);
            useEffect(() => localStorage.setItem('budget', budget), [budget]);
            useEffect(() => localStorage.setItem('savingsGoals', JSON.stringify(savingsGoals)), [savingsGoals]);
            // 改进后的计算器逻辑（支持连续运算 + = 按钮）
            const onKeyboardInput = (key, currentVal, setVal, onConfirm) => {
                if (/[0-9.]/.test(key)) {
                    setVal(v => v === "0" && key !== "." ? key : v + key);
                } else if (["+","-","*","/"].includes(key)) {
                    setCalcExpr(prev => prev + currentVal + key);
                    setVal("0");
                } else if (key === "AC") {
                    setVal("0");
                    setCalcExpr("");
                } else if (key === "DEL") {
                    setVal(v => v.length > 1 ? v.slice(0, -1) : "0");
                } else if (key === "=") {
                    try {
                        const result = safeMath(calcExpr + currentVal);
                        setVal(String(Math.max(-9999999, result).toFixed(2)));
                        setCalcExpr("");
                    } catch(e) {
                        alert("Calculation error");
                    }
                } else if (key === "OK") {
                    try {
                        const result = safeMath(calcExpr + currentVal);
                        const final = Math.max(-9999999, result);
                        onConfirm(final);
                        setCalcExpr("");
                        setVal("0");
                    } catch(e) {
                        alert("Calculation error");
                    }
                }
            };
            const submitRecord = (finalAmt) => {
                if (finalAmt===0 && Number(form.amount)===0) return;
                const amt = Math.abs(finalAmt||Number(form.amount));
                const entry = { id:form.id||Date.now(), type:form.type, amount:amt, category:form.category?.name||"Other", icon:form.category?.icon||"📌", desc:form.desc||form.category?.name, ts:new Date(form.date).getTime(), goalId:form.goalId||null, goalAmount:form.goalId?amt:0 };
                setRecords(prev => form.id?prev.map(r=>r.id===form.id?entry:r):[entry,...prev]);
                if (form.goalId && form.type === "income" && !form.id) {
                    setSavingsGoals(prev => prev.map(g => g.id === form.goalId ? { ...g, currentAmount: g.currentAmount + amt } : g));
                }
                setForm({...form, goalId:null, goalAmount:"0"});
                setModal(null);
            };
            const monthRecords = records.filter(r => getMonthKey(new Date(r.ts))===viewMonth);
            const monthStats = monthRecords.reduce((acc,r) => { acc[r.type]+=r.amount; return acc; }, {income:0,expense:0});
            const budgetRemaining = budget - monthStats.expense;
            const budgetPercent = budget > 0 ? Math.min((monthStats.expense / budget) * 100, 100) : 0;
            const budgetColor = budget <= 0 ? "#666" : budgetPercent <= 60 ? "#27ae60" : budgetPercent <= 90 ? "#f39c12" : "#e74c3c";
            const budgetOver = budget > 0 && monthStats.expense > budget;
            const totalBalance = initialBalance + records.reduce((s,r)=>s+(r.type==="income"?r.amount:-r.amount),0);
            const grouped = useMemo(() => {
                const g = {};
                monthRecords.forEach(r => { const k=getDateKey(new Date(r.ts)); if(!g[k])g[k]=[]; g[k].push(r); });
                return Object.entries(g).sort((a,b)=>b[0].localeCompare(a[0]));
            }, [monthRecords]);
            // 改进后的键盘（增加=按钮）
            const Keyboard = ({ onKey }) => (
                <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:"6px", background:"#f2f2f2", padding:"10px", borderRadius:"16px" }}>
                    {["1","2","3","AC","4","5","6","+","7","8","9","-",".","0","DEL","=","OK"].map(k => (
                        <button key={k} onClick={() => onKey(k)} 
                            className={`num-btn ${k==='OK'?'primary-btn':''}`}
                            style={k==='=' ? {background:"#f0f0f0", fontWeight:"700"} : {}}>
                            {k}
                        </button>
                    ))}
                </div>
            );
            const [showMonthPicker, setShowMonthPicker] = React.useState(false);
            const monthOptions = React.useMemo(() => {
                const cur = getMonthKey(new Date());
                const from = [...new Set(records.map(r=>getMonthKey(new Date(r.ts))))];
                return [cur, ...from.filter(m=>m!==cur)];
            }, [records]);
            const MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
            const monthLabel = m => {
                const cur = getMonthKey(new Date());
                if (m === cur) return "This Month";
                const [y, mo] = m.split("-");
                return `${MONTH_SHORT[Number(mo)-1]} ${y}`;
            };
            const getDailyStats = items => items.reduce((acc,r)=>{ acc[r.type]+=r.amount; return acc; }, {income:0,expense:0});
            // Format date key "YYYY-MM-DD" → "May 25"
            const formatDateLabel = (dateStr) => {
                const [, mo, dd] = dateStr.split("-");
                return `${MONTH_SHORT[Number(mo)-1]} ${Number(dd)}`;
            };
            return (
                <div style={{ paddingBottom:"40px" }} onClick={() => showMonthPicker&&setShowMonthPicker(false)}>
                    {/* Statistics / Chart Page (full-screen overlay) */}
                    {showChart && <ChartPage records={records} onClose={() => setShowChart(false)}/>}
                    {showGoals && <SavingsGoalsPage goals={savingsGoals} setGoals={setSavingsGoals} onClose={() => setShowGoals(false)}/>}
                    {/* Top Panel */}
                    <div style={{ background:"linear-gradient(135deg,#1a1a1a 0%,#434343 100%)", padding:"35px 25px 25px", color:"#fff", borderRadius:"0 0 32px 32px", boxShadow:"0 10px 20px rgba(0,0,0,0.1)" }}>
                        <div style={{ opacity:0.6, fontSize:"12px", marginBottom:"8px" }}>Net Balance</div>
                        <div style={{ display:"flex", alignItems:"center", gap:"12px", marginBottom:"22px" }}>
                            <div onClick={() => { if(!balanceHidden){ setTempBal(String(initialBalance)); setModal("balance"); } }}
                                className={balanceHidden?"balance-blur":"balance-visible"}
                                style={{ fontSize:"38px", fontWeight:"800", cursor:balanceHidden?"default":"pointer", lineHeight:1 }}>
                                {fmt(totalBalance)}
                            </div>
                            <button className="eye-btn" onClick={() => setBalanceHidden(v=>!v)}><EyeIcon open={!balanceHidden}/></button>
                            <button className="eye-btn" onClick={() => setShowGoals(true)} style={{ fontSize:"16px" }}>🎯</button>
                        </div>
                        {/* Budget Progress Bar */}
                        {budget > 0 && (
                            <div onClick={() => { setTempBudget(String(budget)); setCalcExpr(""); setShowBudgetSetting(true); }} style={{ marginBottom:"18px", cursor:"pointer" }}>
                                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"8px" }}>
                                    <span style={{ fontSize:"12px", opacity:0.7 }}>
                                        {budgetOver ? `Over budget by ¥${Math.abs(budgetRemaining).toFixed(2)}` : `Remaining ¥${budgetRemaining.toFixed(2)}`}
                                    </span>
                                    <span style={{ fontSize:"12px", opacity:0.7 }}>{budgetPercent.toFixed(0)}%</span>
                                </div>
                                <div className="budget-bar-bg">
                                    <div className={`budget-bar-fill ${budgetOver ? 'budget-over' : ''}`} style={{ width:`${budgetPercent}%`, background: budgetColor }} />
                                </div>
                                <div style={{ fontSize:"11px", opacity:0.5, marginTop:"6px", textAlign:"right" }}>Budget: ¥{monthStats.expense.toFixed(2)} / ¥{budget.toFixed(2)}</div>
                            </div>
                        )}
                        {budget === 0 && (
                            <div onClick={() => { setTempBudget("0"); setCalcExpr(""); setShowBudgetSetting(true); }} style={{ marginBottom:"18px", padding:"10px 14px", borderRadius:"12px", border:"1px dashed rgba(255,255,255,0.2)", cursor:"pointer", textAlign:"center" }}>
                                <span style={{ fontSize:"12px", opacity:0.5 }}>Set Monthly Budget</span>
                            </div>
                        )}
                        {/* Three action buttons */}
                        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"10px" }}>
                            <button onClick={() => { setForm({...form,type:"income",id:null,amount:"0",category:allCats.income[0]}); setModal("record"); }}
                                style={{ padding:"13px 6px", borderRadius:"14px", border:"none", background:"rgba(255,255,255,0.12)", color:"#fff", fontWeight:"600", cursor:"pointer", fontSize:"13px" }}>＋ Income</button>
                            <button onClick={() => { setForm({...form,type:"expense",id:null,amount:"0",category:allCats.expense[0]}); setModal("record"); }}
                                style={{ padding:"13px 6px", borderRadius:"14px", border:"none", background:"rgba(255,255,255,0.12)", color:"#fff", fontWeight:"600", cursor:"pointer", fontSize:"13px" }}>－ Expense</button>
                            {/* Stats button */}
                            <button onClick={() => setShowChart(true)}
                                style={{ padding:"13px 6px", borderRadius:"14px", border:"none", background:"rgba(255,255,255,0.12)", color:"#fff", fontWeight:"600", cursor:"pointer", fontSize:"13px", display:"flex", alignItems:"center", justifyContent:"center", gap:"5px" }}>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                                </svg>
                                Stats
                            </button>
                        </div>
                    </div>
                    {/* Record List */}
                    <div style={{ padding:"20px" }}>
                        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"20px" }}>
                            <div style={{ position:"relative" }} onClick={e=>e.stopPropagation()}>
                                <div onClick={() => setShowMonthPicker(v=>!v)} style={{ display:"flex", alignItems:"center", gap:"6px", cursor:"pointer", userSelect:"none" }}>
                                    <span style={{ fontSize:"20px", fontWeight:"800", color:"#1a1a1a" }}>{monthLabel(viewMonth)}</span>
                                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style={{ transition:"transform 0.2s", transform:showMonthPicker?"rotate(180deg)":"rotate(0deg)" }}>
                                        <path d="M3 5l4 4 4-4" stroke="#999" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                                    </svg>
                                </div>
                                {showMonthPicker && (
                                    <div className="month-dropdown">
                                        {monthOptions.map(m => (
                                            <div key={m} className={`month-dropdown-item${viewMonth===m?" active":""}`} onClick={() => { setViewMonth(m); setShowMonthPicker(false); }}>{monthLabel(m)}</div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <div style={{ fontSize:"12px", background:"#fff", padding:"4px 12px", borderRadius:"20px", color:"#666", boxShadow:"0 2px 6px rgba(0,0,0,0.02)" }}>
                                In <span style={{ color:"#27ae60", fontWeight:"600" }}>{monthStats.income.toFixed(2)}</span> | Out <span style={{ color:"#e74c3c", fontWeight:"600" }}>{monthStats.expense.toFixed(2)}</span>
                            </div>
                        </div>
                        {grouped.length===0 && (
                            <div style={{ textAlign:"center", color:"#ccc", fontSize:"14px", padding:"60px 0" }}>
                                <div style={{ fontSize:"40px", marginBottom:"12px" }}>📭</div>No records this month
                            </div>
                        )}
                        {grouped.map(([date, items]) => {
                            const daily = getDailyStats(items);
                            const dailyNet = daily.income - daily.expense;
                            return (
                                <div key={date} style={{ marginBottom:"24px" }}>
                                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"10px" }}>
                                        <div style={{ fontSize:"12px", color:"#bbb", fontWeight:"600" }}>{formatDateLabel(date)}</div>
                                        <div style={{ display:"flex", alignItems:"center", gap:"8px", fontSize:"12px" }}>
                                            {daily.income>0 && <span style={{ color:"#27ae60", fontWeight:"600" }}>+{daily.income.toFixed(2)}</span>}
                                            {daily.expense>0 && <span style={{ color:"#e74c3c", fontWeight:"600" }}>-{daily.expense.toFixed(2)}</span>}
                                            {daily.income>0 && daily.expense>0 && (
                                                <span style={{ color:dailyNet>=0?"#27ae60":"#e74c3c", fontWeight:"700", background:dailyNet>=0?"#eafaf1":"#fff1f0", padding:"2px 8px", borderRadius:"20px", fontSize:"11px" }}>
                                                    {dailyNet>=0?"+":""}{dailyNet.toFixed(2)}
                                                </span>
                                            )}
                                        </div>
                                    </div>
                                    <div style={{ background:"#fff", borderRadius:"18px", overflow:"hidden", boxShadow:"0 4px 15px rgba(0,0,0,0.02)" }}>
                                        {items.map((item,idx) => (
                                            <div key={item.id} onClick={() => { setForm({...item,date:getDateKey(new Date(item.ts))}); setModal("record"); }}
                                                style={{ display:"flex", alignItems:"center", padding:"16px", borderBottom:idx===items.length-1?"none":"1px solid #f9f9f9", cursor:"pointer" }}>
                                                <div style={{ width:"42px", height:"42px", borderRadius:"14px", background:item.type==="income"?"#eafaf1":"#fff1f0", display:"flex", alignItems:"center", justifyContent:"center", fontSize:"22px", marginRight:"14px" }}>{item.icon}</div>
                                                <div style={{ flex:1 }}>
                                                    <div style={{ fontSize:"15px", fontWeight:"600", color:"#333" }}>{item.desc}</div>
                                                    <div style={{ fontSize:"11px", color:"#ccc" }}>{item.category}</div>
                                                </div>
                                                <div style={{ fontWeight:"700", fontSize:"16px", color:item.type==="income"?"#27ae60":"#333" }}>
                                                    {item.type==="income"?"+":"-"}{item.amount.toFixed(2)}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    {/* Record Entry Panel */}
                    {(modal==="record"||modal==="datePicker"||modal==="manageCats") && (
                        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.6)", zIndex:100, display:"flex", flexDirection:"column-reverse" }}>
                            <div style={{ background:"#fff", borderRadius:"28px 28px 0 0", padding:"20px 20px 12px", animation:"slideUp 0.3s cubic-bezier(0.25,0.46,0.45,0.94)" }}>
                                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:"20px" }}>
                                    <div style={{ display:"flex", background:"#f0f0f0", borderRadius:"12px", padding:"4px" }}>
                                        {["expense","income"].map(t => (
                                            <div key={t} onClick={() => setForm({...form,type:t,category:allCats[t][0],goalId:null})} 
                                                style={{ padding:"8px 24px", borderRadius:"10px", fontSize:"14px", cursor:"pointer", background:form.type===t?"#fff":"transparent", fontWeight:form.type===t?"700":"400", boxShadow:form.type===t?"0 2px 8px rgba(0,0,0,0.1)":"none", transition:"0.2s" }}>
                                                {t==="expense"?"Expense":"Income"}
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => { setModal(null); setCalcExpr(""); }} style={{ border:"none", background:"none", fontSize:"24px", color:"#ccc", cursor:"pointer" }}>✕</button>
                                </div>
                                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:"20px" }}>
                                    <div onClick={() => setModal("datePicker")} style={{ display:"flex", alignItems:"center", gap:"6px", background:"#f5f5f5", padding:"10px 12px", borderRadius:"10px", cursor:"pointer" }}>
                                        <span style={{ fontSize:"14px", fontWeight:"600", color:"#333" }}>{form.date.replace(/-/g,"/")}</span>
                                        <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M3 5l4 4 4-4" stroke="#999" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                                    </div>
                                    <div style={{ textAlign:"right" }}>
                                        <div style={{ fontSize:"13px", color:"#bbb", height:"18px" }}>{calcExpr}</div>
                                        <div style={{ fontSize:"32px", fontWeight:"800", color:form.type==="income"?"#27ae60":"#e74c3c" }}>{form.amount}</div>
                                    </div>
                                </div>
                                <div style={{ display:"flex", overflowX:"auto", gap:"16px", marginBottom:"20px", paddingBottom:"8px" }}>
                                    {allCats[form.type].map(cat => (
                                        <div key={cat.id} onClick={() => setForm({...form,category:cat})} style={{ flexShrink:0, textAlign:"center", cursor:"pointer" }}>
                                            <div style={{ width:"54px", height:"54px", borderRadius:"18px", background:form.category?.id===cat.id?(form.type==="income"?"#27ae60":"#e74c3c"):"#f5f5f5", color:form.category?.id===cat.id?"#fff":"#333", display:"flex", alignItems:"center", justifyContent:"center", fontSize:"26px", marginBottom:"6px", transition:"0.2s" }}>{cat.icon}</div>
                                            <div style={{ fontSize:"11px", color:"#888", fontWeight:form.category?.id===cat.id?"700":"400" }}>{cat.name}</div>
                                        </div>
                                    ))}
                                    <div onClick={() => setModal("manageCats")} style={{ width:"54px", height:"54px", borderRadius:"18px", border:"2px dashed #eee", display:"flex", alignItems:"center", justifyContent:"center", fontSize:"24px", color:"#ddd", cursor:"pointer" }}>＋</div>
                                </div>
                                <input placeholder="Add a note..." value={form.desc} onChange={e => setForm({...form,desc:e.target.value})} style={{ width:"100%", padding:"15px", background:"#f8f8f8", border:"none", borderRadius:"15px", marginBottom:"20px", boxSizing:"border-box", fontSize:"15px", outline:"none" }}/>
                                {form.type === "income" && savingsGoals.length > 0 && (
                                    <div style={{ background:"#f0faf4", borderRadius:"14px", padding:"12px", marginBottom:"16px" }}>
                                        <div style={{ fontSize:"11px", color:"#27ae60", fontWeight:"600", marginBottom:"8px" }}> Allocate to Savings Goal (optional) </div>
                                        <div style={{ display:"flex", gap:"8px", overflowX:"auto", paddingBottom:"4px" }}>
                                            {savingsGoals.filter(g => g.currentAmount < g.targetAmount).map(g => (
                                                <div key={g.id} onClick={() => setForm({...form, goalId: form.goalId===g.id ? null : g.id})}
                                                    style={{ flexShrink:0, padding:"8px 14px", borderRadius:"12px", background: form.goalId===g.id ? "#27ae60" : "#fff", color: form.goalId===g.id ? "#fff" : "#333", fontSize:"13px", fontWeight:"600", cursor:"pointer", display:"flex", alignItems:"center", gap:"6px", transition:"0.15s", border: form.goalId===g.id ? "none" : "1px solid #e0e0e0" }}>
                                                    <span>{g.icon}</span>{g.name}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                <Keyboard onKey={k => onKeyboardInput(k,form.amount,(v)=>setForm(prev=>({...prev,amount:typeof v==='function'?v(prev.amount):v})),(final)=>submitRecord(final))}/>
                                {form.id && <button onClick={() => {
                                    const deleted = records.find(x=>x.id===form.id);
                                    setRecords(r=>r.filter(x=>x.id!==form.id));
                                    if (deleted && deleted.goalId && deleted.goalAmount) {
                                        setSavingsGoals(prev => prev.map(g => g.id === deleted.goalId ? {...g, currentAmount: Math.max(0, g.currentAmount - deleted.goalAmount)} : g));
                                    }
                                    setModal(null);
                                }} style={{ width:"100%", background:"none", border:"none", color:"#ff4d4f", marginTop:"15px", fontSize:"14px", cursor:"pointer" }}>Delete Record</button>}
                            </div>
                            {modal==="datePicker" && <DatePickerModal value={form.date} onConfirm={d => { setForm(f=>({...f,date:d})); setModal("record"); }} onClose={() => setModal("record")}/>}
                            {modal==="manageCats" && <ManageCatsModal form={form} customCats={customCats} setCustomCats={setCustomCats} onClose={() => setModal("record")}/>}
                        </div>
                    )}
                    {/* Set Initial Balance */}
                    {modal==="balance" && (
                        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.6)", zIndex:100, display:"flex", flexDirection:"column-reverse" }}>
                            <div style={{ background:"#fff", borderRadius:"28px 28px 0 0", padding:"25px", animation:"slideUp 0.3s" }}>
                                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"30px" }}>
                                    <div>
                                        <h3 style={{ margin:0, fontSize:"18px" }}>Set Starting Balance</h3>
                                        <p style={{ margin:"4px 0 0", fontSize:"12px", color:"#999" }}>Enter your actual total savings at the start of tracking</p>
                                    </div>
                                    <button onClick={() => { setModal(null); setCalcExpr(""); }} style={{ border:"none", background:"none", fontSize:"24px", color:"#ccc" }}>✕</button>
                                </div>
                                <div style={{ textAlign:"center", marginBottom:"30px" }}>
                                    <div style={{ fontSize:"14px", color:"#bbb", height:"20px" }}>{calcExpr}</div>
                                    <div style={{ fontSize:"40px", fontWeight:"800", color:"#1a1a1a" }}>{tempBal}</div>
                                </div>
                                <Keyboard onKey={k => onKeyboardInput(k,tempBal,setTempBal,(final)=>{ setInitialBalance(final); setModal(null); })}/>
                            </div>
                        </div>
                    )}
                    {/* Budget Settings Modal */}
                    {showBudgetSetting && (
                        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.6)", zIndex:200, display:"flex", flexDirection:"column-reverse" }}>
                            <div style={{ background:"#fff", borderRadius:"28px 28px 0 0", padding:"25px", animation:"slideUp 0.3s" }}>
                                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"30px" }}>
                                    <div>
                                        <h3 style={{ margin:0, fontSize:"18px" }}>Set Monthly Budget</h3>
                                        <p style={{ margin:"4px 0 0", fontSize:"12px", color:"#999" }}>Set your monthly spending limit</p>
                                    </div>
                                    <button onClick={() => { setShowBudgetSetting(false); setCalcExpr(""); }} style={{ border:"none", background:"none", fontSize:"24px", color:"#ccc" }}>✕</button>
                                </div>
                                <div style={{ textAlign:"center", marginBottom:"30px" }}>
                                    <div style={{ fontSize:"14px", color:"#bbb", height:"20px" }}>{calcExpr}</div>
                                    <div style={{ fontSize:"40px", fontWeight:"800", color:"#1a1a1a" }}>¥{tempBudget}</div>
                                </div>
                                <Keyboard onKey={k => onKeyboardInput(k,tempBudget,setTempBudget,(final)=>{ setBudget(Math.max(0,final)); setShowBudgetSetting(false); setCalcExpr(""); })}/>
                                {budget > 0 && (
                                    <button onClick={() => { setBudget(0); setShowBudgetSetting(false); setCalcExpr(""); }} style={{ width:"100%", background:"none", border:"none", color:"#ff4d4f", marginTop:"15px", fontSize:"14px", cursor:"pointer" }}>Clear Budget</button>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(r => console.log('SW registered:', r.scope))
                    .catch(e => console.log('SW failed:', e));
            });
        }
    </script>
</body>
</html>
